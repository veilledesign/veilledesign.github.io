<style>
/* Layout: nav pill flottante, hero en pastilles, édition vedette, archives façon changelog. Deux thèmes : clair et sombre, plus FR/EN. */
/* Palette Nicky : noir profond, blanc craie, graphite + le jaune de l'avatar LinkedIn (#FBC436). Inter + DM Mono. */
:root{
  --bg:#F4F4F1; --bg-2:#FFFFFF; --bg-3:#EAEAE6; --ink:#0B0B0D; --muted:#5D5F66; --line:#DCDCD6;
  --nav:#FFFFFF; --nav-btn:#EDEDE9; --menu-hover:#F0F0EC;
  --pill:#FFE7A3; --pill-ink:#2A1F00;
  --accent:#FBC436; --accent-2:#FFD25F; --accent-ink:#0B0B0D; --accent-soft:#FFF4D2; --accent-soft-ink:#3A2B00;
  --card:#FFFFFF; --card-ink:#0B0B0D; --card-muted:#5D5F66; --chip:#F0F0EC; --trend:#FFFFFF; --trend-ink:#0B0B0D; --trend-muted:#4A4C53;
  --solid:#0B0B0D; --solid-ink:#F4F4F1; --link:#8A5A00; --concret:#2B2D33;
  --t-outil:#FFF4D2; --t-outil-b:#F5DE9B; --t-outil-k:#8A5A00;
  --t-event:#FFF4D2; --t-event-b:#F5DE9B; --t-event-k:#8A5A00;
  --board:#FFFFFF; --board-dot:#D9D9D3; --block:#E7E7E2; --block-2:#CFCFC8;
  --shadow:0 10px 30px rgba(11,11,13,.08);
  --display:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --pc-bg:#FFF4D2; --pc-ink:#2A1F00;
  --g1:linear-gradient(135deg,#1C1D22 0%,#3A3C44 100%);
  --g2:linear-gradient(135deg,#FBC436 0%,#FFD25F 100%);
  --g3:linear-gradient(160deg,#2B2D33 0%,#5D5F66 100%);
  --g4:linear-gradient(135deg,#0B0B0D 0%,#2B2D33 60%,#8A5A00 100%);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B0B0D; --bg-2:#16171B; --bg-3:#202127; --ink:#F4F4F1; --muted:#9A9CA5; --line:#2A2B31;
  --nav:#121317; --nav-btn:#202127; --menu-hover:#1D1E23;
  --pill:#3A2F10; --pill-ink:#FFE29A;
  --accent:#FBC436; --accent-2:#FFD25F; --accent-ink:#0B0B0D; --accent-soft:#251F0E; --accent-soft-ink:#FFE7A3; --pc-bg:#1E1A0E; --pc-ink:#FFF4D2; --pc-op:.38;
  --card:#16171B; --card-ink:#F4F4F1; --card-muted:#9A9CA5; --chip:#202127; --trend:#16171B; --trend-ink:#F4F4F1; --trend-muted:#B4B6BE;
  --solid:#F4F4F1; --solid-ink:#0B0B0D; --link:#FBC436; --concret:#D3D4D9;
  --t-outil:#251F0E; --t-outil-b:#4A3D17; --t-outil-k:#FBC436;
  --t-event:#251F0E; --t-event-b:#4A3D17; --t-event-k:#FBC436;
  --board:#16171B; --board-dot:#2E2F36; --block:#26272E; --block-2:#3A3B43;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0B0D; --bg-2:#16171B; --bg-3:#202127; --ink:#F4F4F1; --muted:#9A9CA5; --line:#2A2B31;
  --nav:#121317; --nav-btn:#202127; --menu-hover:#1D1E23;
  --pill:#3A2F10; --pill-ink:#FFE29A;
  --accent:#FBC436; --accent-2:#FFD25F; --accent-ink:#0B0B0D; --accent-soft:#251F0E; --accent-soft-ink:#FFE7A3; --pc-bg:#1E1A0E; --pc-ink:#FFF4D2; --pc-op:.38;
  --card:#16171B; --card-ink:#F4F4F1; --card-muted:#9A9CA5; --chip:#202127; --trend:#16171B; --trend-ink:#F4F4F1; --trend-muted:#B4B6BE;
  --solid:#F4F4F1; --solid-ink:#0B0B0D; --link:#FBC436; --concret:#D3D4D9;
  --t-outil:#251F0E; --t-outil-b:#4A3D17; --t-outil-k:#FBC436;
  --t-event:#251F0E; --t-event-b:#4A3D17; --t-event-k:#FBC436;
  --board:#16171B; --board-dot:#2E2F36; --block:#26272E; --block-2:#3A3B43;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--display);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;margin:0}
a{color:inherit}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--link);outline-offset:3px}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:0 64px}

/* Nav */
.nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 14px);z-index:20;display:flex;justify-content:center;margin-top:14px}
.nav-inner{position:relative;display:flex;align-items:center;gap:6px;padding:6px;border-radius:999px;background:var(--nav);border:1px solid var(--line);box-shadow:var(--shadow);max-width:100%}
.logo{background:var(--pill);color:var(--pill-ink);border:0;border-radius:999px;padding:9px 16px;font:700 17px/1 var(--display);letter-spacing:-.03em;cursor:pointer;white-space:nowrap;text-decoration:none}
.logo i{font-weight:500}
.icon-btn{width:40px;height:40px;flex:none;border-radius:50%;border:0;background:var(--nav-btn);color:var(--ink);display:grid;place-items:center;cursor:pointer;font:600 12px var(--mono)}
.menu-btn{background:var(--solid);color:var(--solid-ink);border:0;border-radius:999px;padding:10px 18px;font:600 15px/1 var(--display);cursor:pointer}
.searchbox{display:flex;align-items:center;flex:none}
@media (max-width:440px){.logo{font-size:15px;padding:9px 12px}.icon-btn{width:36px;height:36px}.menu-btn{padding:10px 14px;font-size:14px}.searchbox.open input{width:110px}.nav-inner{gap:4px}}
.searchbox input{width:0;padding:0;border:0;background:transparent;color:var(--ink);font:500 15px var(--display);transition:width .2s ease,padding .2s ease}
.searchbox.open input{width:min(38vw,200px);padding:0 10px}
.searchbox input::placeholder{color:var(--muted)}
.menu-panel{position:absolute;top:58px;right:0;width:min(320px,calc(100vw - 32px));background:var(--nav);border:1px solid var(--line);border-radius:22px;padding:10px;display:grid;gap:2px;box-shadow:var(--shadow)}
.menu-panel a{display:flex;justify-content:space-between;align-items:center;color:var(--ink);font:600 16px var(--display);padding:11px 14px;border-radius:14px;text-decoration:none}
.menu-panel a:hover,.menu-panel a[aria-current="page"]{background:var(--menu-hover)}
.menu-panel .n{font:500 12px var(--mono);color:var(--muted)}
.menu-panel hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
.prefs{display:flex;gap:8px;padding:6px 8px}
.seg{display:flex;flex:1;background:var(--bg-3);border-radius:999px;padding:3px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);border-radius:999px;padding:7px 8px;font:600 13px var(--display);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--bg-2);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* Hero */
.hero{text-align:center;padding-block:64px 8px;display:grid;justify-items:center;gap:10px}
.hl{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px}
.hl span{background:var(--pill);color:var(--pill-ink);font:600 clamp(34px,7vw,62px)/1.08 var(--display);letter-spacing:-.04em;padding:.08em .32em .14em;border-radius:.42em}
.spark{width:32px;height:32px;flex:none;background:var(--accent);animation:spin 9s linear infinite;clip-path:polygon(20% 0,50% 30%,80% 0,100% 20%,70% 50%,100% 80%,80% 100%,50% 70%,20% 100%,0 80%,30% 50%,0 20%)}
.hero p{color:var(--muted);font-size:clamp(17px,2.2vw,20px);max-width:46ch;margin:12px 0 0;text-wrap:balance}
/* Scène animée : un agent assemble une interface à partir des tokens */
@keyframes spin{to{transform:rotate(360deg)}}
.stage{position:relative;width:min(760px,100%);margin:40px auto 4px;border-radius:32px;padding:clamp(14px,3vw,28px);
  background-color:var(--accent);background-image:repeating-conic-gradient(var(--accent-2) 0 25%,transparent 0 50%);background-size:56px 56px;
  display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr);gap:clamp(10px,2vw,18px);align-items:stretch;text-align:left}
@media (max-width:600px){.stage{grid-template-columns:minmax(0,1fr)}.tokens{flex-direction:row!important;flex-wrap:wrap}}
.tokens{display:flex;flex-direction:column;gap:8px;justify-content:center}
.tok{display:flex;align-items:center;gap:8px;background:var(--board);color:var(--ink);border-radius:12px;padding:8px 10px;font:500 12px var(--mono);box-shadow:0 2px 0 rgba(0,0,0,.12);transition:transform .35s ease,box-shadow .35s ease}
.tok i{width:14px;height:14px;border-radius:4px;flex:none;background:var(--block-2)}
.tok.t-color i{background:var(--accent);border:1px solid rgba(0,0,0,.2)}.tok.t-radius i{border-radius:50%}.tok.t-type i{background:none;font:700 12px var(--display);display:grid;place-items:center;font-style:normal}
.tok.hot{transform:translateX(6px) scale(1.04);box-shadow:0 0 0 2px var(--ink)}
.board{position:relative;background:var(--board);border-radius:20px;padding:16px;min-height:220px;overflow:hidden;
  background-image:radial-gradient(var(--board-dot) 1px,transparent 1px);background-size:14px 14px;display:grid;gap:10px;align-content:start;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.frame-label{position:absolute;top:8px;right:12px;font:500 10.5px var(--mono);color:var(--muted);letter-spacing:.06em}
.blk{opacity:.0;transform:translateY(6px) scale(.98);transition:opacity .35s ease,transform .35s ease,outline-color .6s ease;outline:2px solid transparent;outline-offset:3px;border-radius:10px}
.blk.on{opacity:1;transform:none}
.blk.flash{outline-color:var(--accent)}
.b-nav{display:flex;align-items:center;gap:8px;background:var(--block);padding:8px 10px}
.b-nav .lg{width:46px;height:12px;border-radius:6px;background:var(--accent)}
.b-nav .ln{width:26px;height:8px;border-radius:4px;background:var(--block-2)}
.b-nav .bt{margin-left:auto;width:38px;height:16px;border-radius:999px;background:var(--ink)}
.b-title{height:16px;width:72%;background:var(--ink)!important;border-radius:6px}
.b-sub{height:9px;width:48%;background:var(--block-2);border-radius:5px}
.b-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.b-card{height:58px;background:var(--block);border-radius:12px;position:relative}
.b-card::after{content:"";position:absolute;left:8px;bottom:8px;width:55%;height:7px;border-radius:4px;background:var(--block-2)}
.b-card:first-child{background:var(--accent)}
.b-btn{justify-self:start;height:26px;width:118px;border-radius:999px;background:var(--ink)}
.cursor{position:absolute;left:0;top:0;z-index:3;display:flex;align-items:flex-start;gap:4px;transition:transform .55s cubic-bezier(.5,0,.2,1);pointer-events:none}
.cursor svg{filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
.cursor span{background:var(--ink);color:var(--bg);font:600 11px var(--display);padding:3px 8px;border-radius:999px;margin-top:12px}
.log{grid-column:1/-1;display:flex;align-items:center;gap:10px;background:#0B0B0D;color:#F4F4F1;border-radius:999px;padding:8px 14px;font:500 12.5px var(--mono);justify-self:center;max-width:100%}
.log .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.spark,.log .dot{animation:none}.blk{transition:none}.cursor{display:none}}
.eyebrow{font:500 13px var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--muted);text-align:center;margin:52px 0 16px}
.progress{position:fixed;top:0;left:0;right:0;height:3px;z-index:60;pointer-events:none}.progress i{display:block;height:100%;background:var(--accent);transform-origin:0 50%;transform:scaleX(0)}
.tp-bar{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:14px;margin:6px 0 30px}
.tp-bar .rx-tabs{margin:0;justify-content:center}.tp-per{flex:0 0 auto;min-width:min(100%,360px)}.tp-per button{white-space:nowrap}
.tp-feat{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;text-decoration:none;color:var(--ink);margin-bottom:36px}
.tp-feat .pc{position:relative;aspect-ratio:21/8;border-radius:22px;overflow:hidden;display:grid;place-items:center;padding:22px;background:var(--pc-bg)}
.tp-feat .pc::before{content:"";position:absolute;inset:-25%;background:var(--pc-blobs);filter:blur(34px);opacity:var(--pc-op,1);transition:transform .5s}
.tp-feat:hover .pc::before{transform:scale(1.08) rotate(4deg)}
.tp-feat .pc b{position:relative;font:600 clamp(26px,4.2vw,44px)/1.08 var(--display);letter-spacing:-.025em;text-align:center;color:var(--pc-ink);text-wrap:balance;max-width:92%}
.tp-feat .pc .pill{position:absolute;top:16px;left:16px;z-index:1;background:var(--bg);color:var(--ink);font:600 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:4px 9px}
.tp-n{display:block;font:500 13px var(--mono);color:var(--muted);letter-spacing:.06em;margin-bottom:10px}
.tp-feat h2{margin:0 0 10px;font:500 clamp(24px,3vw,34px)/1.15 var(--display);letter-spacing:-.02em}
.tp-feat:hover h2{text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1px}
.tp-fb{display:flex;justify-content:space-between;align-items:flex-start;gap:16px 40px}
.tp-feat p{margin:6px 0 0;max-width:46ch;color:var(--muted);font-size:15.5px;line-height:1.5}
@media (max-width:640px){.tp-fb{flex-direction:column}.tp-feat p{margin:0}}
.tp-meta{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.tp-c{font:500 12px var(--mono);background:var(--pill);color:var(--pill-ink);border-radius:999px;padding:3px 9px;white-space:nowrap}
.tp-mv{font:600 11px var(--mono);letter-spacing:.04em;white-space:nowrap;color:var(--muted)}.tp-mv.up{color:#1f8a4c}.tp-mv.dn{color:#c2410c}
.tp-mv.new{background:var(--accent);color:#111;border-radius:4px;padding:2px 6px;text-transform:uppercase}
.tp-sp{display:block;width:72px;height:22px;color:var(--ink)}.tp-feat .tp-sp{width:120px;height:30px}
.tp-sp polyline{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}.tp-sp circle{fill:var(--accent);stroke:var(--ink);stroke-width:1}
.tp-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:clamp(20px,4vw,48px)}
.tp-list li{border-top:1px solid var(--line)}
.tp-row{display:grid;grid-template-columns:28px 40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 0;color:var(--ink);text-decoration:none;min-height:44px}
.tp-row:hover .tp-nm b{text-decoration:underline;text-underline-offset:3px}
.tp-row .i{font:500 13px var(--mono);color:var(--muted)}
.tp-av{position:relative;width:40px;height:40px;border-radius:10px;overflow:hidden;display:grid;place-items:center;background:var(--pc-bg)}
.tp-av::before{content:"";position:absolute;inset:-30%;background:var(--pc-blobs);filter:blur(10px)}
.tp-av span{position:relative;font:600 16px var(--display);color:var(--pc-ink)}
.tp-feat .pc.dk,.tp-av.dk{background:radial-gradient(120% 140% at 28% 18%,#3b3b40 0,#161618 52%,#050506 100%)}
.tp-feat .pc.dk::before,.tp-av.dk::before{display:none}
.tp-feat .pc.dk b,.tp-av.dk span{color:#f4f4f1}
.tp-lg{position:relative;display:block;object-fit:contain}
.tp-lg.mono{filter:invert(1)}
.tp-feat .tp-ph{width:clamp(96px,12vw,140px);height:clamp(96px,12vw,140px);border-radius:28px;object-fit:cover;box-shadow:0 0 0 5px var(--bg),0 10px 30px rgba(0,0,0,.18)}
.tp-av .tp-ph{position:absolute;inset:0;width:100%;height:100%;border-radius:inherit;object-fit:cover}
.tp-feat .tp-lg:not(.tp-ph){width:clamp(64px,9vw,104px);height:clamp(64px,9vw,104px)}.tp-feat .tp-lg:not(.mono):not(.tp-ph){border-radius:22px}
.tp-av .tp-lg:not(.tp-ph){width:20px;height:20px}.tp-av .tp-lg:not(.mono):not(.tp-ph){width:24px;height:24px;border-radius:6px}
.tp-lg[hidden]+b,.tp-lg[hidden]+span{display:block}.tp-lg:not([hidden])+b,.tp-lg:not([hidden])+span{display:none}
.tp-nm{min-width:0}.tp-nm b{display:block;font-weight:600;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tp-nm small{display:block;color:var(--muted);font-size:13px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tp-r{display:flex;align-items:center;gap:10px}.tp-r .tp-rc{display:grid;justify-items:end;gap:4px}
.tp-feat:focus-visible,.tp-row:focus-visible,.tp-bar button:focus-visible{outline:3px solid var(--link);outline-offset:4px}
.tp-foot{margin:22px 0 0;color:var(--muted);font-size:13px}
@media (max-width:820px){.tp-per{flex:1 1 100%}.tp-feat .pc{aspect-ratio:16/10}.tp-list{grid-template-columns:minmax(0,1fr)}}
@media (max-width:480px){.tp-sp{display:none}.tp-feat .tp-sp{display:block}.tp-row{grid-template-columns:24px 36px minmax(0,1fr) auto;gap:10px}.tp-av{width:36px;height:36px}}
@media (prefers-reduced-motion:reduce){.tp-feat .pc::before{transition:none}.tp-feat:hover .pc::before{transform:none}}
.pager{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;margin:28px 0 8px}.pager a,.pager span{min-width:36px;height:36px;display:inline-grid;place-items:center;padding:0 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink);text-decoration:none;font:500 13px var(--mono)}.pager [aria-current]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.topics{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:26px auto 0;max-width:820px}
.topic{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:7px 14px 7px 11px;font:500 14px var(--display);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:7px}
.ti{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cover-hero{margin:6px 0 18px}.ecard.cover-hero .pc{aspect-ratio:21/9;border-radius:22px}.ecard.cover-hero .pc b{font-size:clamp(24px,4.2vw,40px)}.cover-hero .pill{top:16px;left:16px}
@media (max-width:640px){.ecard.cover-hero .pc{aspect-ratio:16/10}}
.ecard .pill{display:inline-flex;align-items:center;gap:5px}.ecard .pill .ti{width:12px;height:12px}
.topic:hover{background:var(--pill);color:var(--pill-ink);border-color:var(--pill)}
.topic small{font:400 12px var(--mono);opacity:.65;margin-left:4px}

/* Lead */
.lead{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.lead{grid-template-columns:minmax(0,1fr)}}
.feature{background:var(--accent);color:var(--accent-ink);border-radius:28px;padding:clamp(24px,5vw,40px);display:grid;justify-items:center;text-align:center;gap:14px}
.badge{background:rgba(0,0,0,.08);color:#0B0B0D;border:1px solid rgba(0,0,0,.18);font:500 12.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;padding:8px 16px;border-radius:999px}

.cta{background:#0B0B0D;color:#FBC436;border:0;border-radius:999px;padding:13px 26px;font:600 17px var(--display);cursor:pointer;text-decoration:none;margin-top:4px}
.recent{background:var(--bg-2);border:1px solid var(--line);border-radius:28px;padding:22px 22px 10px;min-width:0}

.recent a{display:grid;gap:4px;border-top:1px solid var(--line);padding:14px 0;color:var(--ink);text-decoration:none}
.recent a:first-of-type{border-top:0}
.recent .k{font:500 11.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.recent .t{font:500 16px/1.3 var(--display)}
.recent a:hover .t{text-decoration:underline;text-underline-offset:3px}

/* Cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:36px 22px}
.ecard{display:grid;gap:10px;align-content:start;text-decoration:none;color:var(--ink);min-width:0}
.ecard .pc{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;display:grid;place-items:center;padding:22px;background:var(--pc-bg)}
.ecard .pc::before{content:"";position:absolute;inset:-25%;background:var(--pc-blobs);filter:blur(34px);opacity:var(--pc-op,1);transition:transform .5s}
.ecard:hover .pc::before{transform:scale(1.08) rotate(4deg)}@media (prefers-reduced-motion:reduce){.ecard .pc::before{transition:none}.ecard:hover .pc::before{transform:none}}
.ecard .pc b{position:relative;font:600 clamp(19px,2.3vw,25px)/1.12 var(--display);letter-spacing:-.02em;text-align:center;color:var(--pc-ink);text-wrap:balance;max-width:92%}
.ecard .pill{position:absolute;top:12px;left:12px;z-index:1;background:var(--bg);color:var(--ink);font:600 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:4px 9px}
.ecard h3{margin:4px 0 0;font:600 17px/1.3 var(--display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ecard .ex{margin:0;color:var(--muted);font-size:14.5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ecard .dt{font-size:13px;color:var(--muted)}
.ecard .by{display:flex;align-items:center;gap:8px;font-size:13px}.ecard .by img{width:22px;height:22px;border-radius:50%;object-fit:cover}.ecard .by span{color:var(--muted)}
.card{background:var(--card);color:var(--card-ink);border-radius:22px;padding:10px 10px 18px;display:grid;gap:12px;align-content:start;text-decoration:none;border:1px solid var(--line);min-width:0}
.cover{border-radius:14px;aspect-ratio:16/10;padding:16px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;overflow:hidden}
.cover b{font:700 clamp(18px,2.4vw,22px)/1.08 var(--display);letter-spacing:-.02em}
.cover b i{font-weight:600}
.dots{display:flex;gap:6px;align-self:flex-start;background:rgba(255,255,255,.18);padding:6px 8px;border-radius:10px}
.dots span{width:16px;height:16px;border-radius:5px;background:rgba(255,255,255,.85)}
.dots span:nth-child(2){border-radius:50%}
.chip{justify-self:start;background:var(--chip);color:var(--card-muted);font:500 13px var(--display);padding:3px 10px;border-radius:8px}
.card h3{margin:0 6px;font:500 18.5px/1.3 var(--display);letter-spacing:-.01em;text-wrap:balance}
.card .sub{margin:0 6px;color:var(--card-muted);font-size:14px}
.more{display:flex;justify-content:center;margin-top:22px}
.ghost-btn{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:10px 20px;font:600 15px var(--display);cursor:pointer;text-decoration:none}

/* Reader */
.reader-grid{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:40px;max-width:1040px;margin:0 auto;align-items:start}
.reader{display:grid;gap:16px;padding-top:44px;min-width:0}
.crumbs{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.back{background:var(--bg-3);color:var(--ink);border:0;border-radius:999px;padding:8px 15px;font:600 14px var(--display);text-decoration:none}
.when{font:500 12.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.reader h1{font:600 clamp(30px,5vw,44px)/1.42 var(--display);letter-spacing:-.03em;margin:0;text-wrap:balance}
.reader h1 mark{background:var(--pill);color:var(--pill-ink);padding:.04em .22em;border-radius:.3em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.reading{display:flex;flex-wrap:wrap;gap:8px}
.reading span{background:var(--bg-3);border-radius:999px;padding:5px 12px;font:500 13px var(--display);color:var(--muted)}
.section-label{scroll-margin-top:96px;font:500 12.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:26px 0 0}
.essentiel{background:var(--accent-soft);color:var(--accent-soft-ink);border-radius:22px;padding:20px 24px}
.essentiel ul{margin:0;padding-left:18px;display:grid;gap:6px;font-size:16.5px}
.evts{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:22px}
.evt{position:relative}
.evt-shell{position:relative;z-index:1;background:var(--bg-2);border:1px solid var(--line);border-radius:24px;overflow:hidden}
.evt-head{display:flex;align-items:center;gap:9px;padding:11px 18px;color:var(--muted);font:500 14.5px var(--display)}
.evt-body{background:var(--card);border-top:1px solid var(--line);border-radius:22px;padding:18px;display:grid;gap:12px}
.evt-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.evt-t{font:600 18px/1.3 var(--display);color:var(--ink)}
.evt-det{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:6px 12px;border:1px solid var(--line);border-radius:12px;color:var(--muted);font:500 13.5px var(--display);text-decoration:none}
.evt-det:hover{color:var(--ink);border-color:var(--ink)}
.evt-when{margin:0;font:500 15.5px var(--display);color:var(--ink)}.evt-rel{color:var(--link)}
.evt-row{margin:0;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14.5px}
.evt-ctx{display:flex;gap:12px;border:1.5px dashed var(--line);border-radius:14px;padding:14px;background:var(--bg-2)}
.evt-ctx p{margin:0;color:var(--muted);font-size:14.5px;line-height:1.55}.evt-ctx b{color:var(--ink);font-weight:600}.evt-ctx .ei{color:var(--link);margin-top:2px}
.evt-cta{display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px;border:1px solid var(--line);border-radius:14px;color:var(--ink);font:600 15px var(--display);text-decoration:none;background:var(--bg-2)}
.evt-cta:hover{border-color:var(--ink)}
.evt-det:focus-visible,.evt-cta:focus-visible{outline:3px solid var(--link);outline-offset:2px}
.ei{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.rx{margin-top:0}
.sec-h{margin:72px 0 32px;font:400 clamp(34px,5vw,52px)/1.05 var(--display);letter-spacing:-.03em;color:var(--ink)}
.pc.illus{padding:0;background:none}.pc.illus::before{display:none}.dz{position:absolute;inset:0;width:100%;height:100%;display:block;--bg:var(--l-bg);--ink:var(--l-ink)}
.dz .dz-bg{fill:var(--l-bg)}.dz .dz-ink{stroke:var(--l-ink)}
:root[data-theme="dark"] .dz .dz-bg{fill:var(--d-bg)}:root[data-theme="dark"] .dz .dz-ink{stroke:var(--d-ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dz .dz-bg{fill:var(--d-bg)}:root:not([data-theme="light"]) .dz .dz-ink{stroke:var(--d-ink)}}
.dz{transition:transform .5s ease}.rx-card:hover .dz,.rx-feat:hover .dz{transform:scale(1.03)}
@media (prefers-reduced-motion:reduce){.dz{transition:none}.rx-card:hover .dz,.rx-feat:hover .dz{transform:none}}
.dz-wrap{border:1px solid var(--line)}
.pc.illus .pill{z-index:2}
.rx-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:24px;margin-bottom:36px}
.rx-head h2{margin:0;font:400 clamp(34px,5vw,52px)/1 var(--display);letter-spacing:-.03em}.rx-head p{margin:0;color:var(--muted);font-size:15px}
.rx-feat{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:clamp(20px,4vw,48px);align-items:center;text-decoration:none;color:var(--ink)}
.rx-feat .cover-hero{margin:0}.rx-feat .cover-hero .pc{aspect-ratio:16/7}
.rx-ft h3{margin:0 0 12px;font:400 clamp(22px,2.6vw,30px)/1.2 var(--display);letter-spacing:-.02em}.rx-ft p{margin:0 0 20px;color:var(--muted);font-size:15.5px;line-height:1.5}
.rx-meta{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.rtag{display:inline-block;justify-self:start;background:var(--chip);color:var(--muted);font:500 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:5px 8px}
.rx-dt{color:var(--muted);font-size:13.5px}
.rx-feat:hover h3,.rx-card:hover h3{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.rx-tabs{display:flex;flex-wrap:wrap;gap:8px;margin:52px 0 28px}
.rx-tabs .topic{min-height:38px}
.rx-tabs .topic[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:48px 18px}
.rx-card .rtag{align-self:flex-start}.rx-card{display:flex;flex-direction:column;gap:12px;text-decoration:none;color:var(--ink);min-width:0}.rx-card[hidden]{display:none}
.rx-card .pc{position:relative;aspect-ratio:1/1;border-radius:6px;overflow:hidden;display:grid;place-items:center;padding:22px;background:var(--pc-bg)}
.rx-card .pc::before{content:"";position:absolute;inset:-25%;background:var(--pc-blobs);filter:blur(34px);opacity:var(--pc-op,1)}
.rx-card .pc b{position:relative;font:500 clamp(20px,2.2vw,26px)/1.15 var(--display);color:var(--pc-ink);text-align:center;letter-spacing:-.02em}
.rx-card h3{margin:4px 0 0;font:500 17px/1.3 var(--display)}.rx-card p{margin:0;color:var(--muted);font-size:14px;line-height:1.45}
.rx-card .rx-dt{margin-top:auto;padding-top:22px}
.rx-more{display:flex;justify-content:center;margin-top:48px}
.rx-more button{background:none;border:0;border-bottom:1.5px solid var(--ink);padding:8px 2px;color:var(--ink);font:600 13px var(--display);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;display:inline-flex;gap:10px;align-items:center}
.rx-feat:focus-visible,.rx-card:focus-visible,.rx-tabs button:focus-visible,.rx-more button:focus-visible{outline:3px solid var(--link);outline-offset:4px}
@media (max-width:820px){.rx-feat{grid-template-columns:minmax(0,1fr)}.rx-feat .cover-hero .pc{aspect-ratio:16/9}}
.sp{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:70;display:flex;align-items:center;gap:10px;height:40px;padding:0 10px 0 8px;border-radius:999px;background:rgba(20,20,22,.78);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);box-shadow:0 8px 24px rgba(0,0,0,.35);overflow:hidden;transition:padding .3s ease}
.sp-vinyl{width:28px;height:28px;flex:none;border-radius:50%;box-shadow:0 0 0 1px rgba(255,255,255,.12)}.sp-vinyl svg{display:block;width:28px;height:28px}
.sp:not([data-paused]) .sp-vinyl{animation:vinyl 2.6s linear infinite}
@keyframes vinyl{to{transform:rotate(360deg)}}
.sp-x{display:flex;align-items:center;gap:12px;white-space:nowrap}
.sp-mq{width:150px;height:16.8px;overflow:hidden;white-space:nowrap;font:500 13.5px/16.8px var(--display);letter-spacing:.14px;color:#F4F2EC;-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent)}
.sp-mq span{display:inline-block;animation:mq var(--mq,20s) linear infinite}.sp[data-paused] .sp-mq span{animation-play-state:paused}
@keyframes mq{to{transform:translateX(-50%)}}
.sp-c{width:22px;height:22px;padding:0;border:0;background:none;display:grid;place-items:center;cursor:pointer;opacity:.9;flex:none}
.sp-c:hover{opacity:1}.sp-c img{display:block;width:18px;height:18px}
.sp-main{width:26px;height:26px}.sp-main img{width:22px;height:22px}
.sp-main .ic-pause{display:block}.sp-main .ic-play{display:none}.sp[data-paused] .sp-main .ic-play{display:block}.sp[data-paused] .sp-main .ic-pause{display:none}
.sp-seek{-webkit-appearance:none;appearance:none;position:absolute;left:18px;right:18px;bottom:1px;width:auto;height:6px;margin:0;padding:0;background:transparent;cursor:pointer;--p:0%}
.sp-seek::-webkit-slider-runnable-track{height:2px;border-radius:999px;background:linear-gradient(90deg,#F4F2EC var(--p),rgba(255,255,255,.2) var(--p))}
.sp-seek::-moz-range-track{height:2px;border-radius:999px;background:rgba(255,255,255,.2)}.sp-seek::-moz-range-progress{height:2px;border-radius:999px;background:#F4F2EC}
.sp-seek::-webkit-slider-thumb{-webkit-appearance:none;width:2px;height:2px;background:transparent}.sp-seek::-moz-range-thumb{width:2px;height:2px;border:0;background:transparent}
.sp-c:focus-visible,.sp-seek:focus-visible{outline:2px solid #FBC436;outline-offset:3px;border-radius:6px}
@media (prefers-reduced-motion:reduce){.sp-mq span{animation:none}.sp-vinyl{animation:none!important}}
.synths{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.synth{background:var(--card);color:var(--card-ink);border:1px solid var(--line);border-radius:22px;padding:20px 22px;display:grid;gap:8px;align-content:start;text-decoration:none;transition:border-color .15s,transform .15s}
.synth:hover{border-color:var(--ink);transform:translateY(-2px)}.synth[hidden]{display:none!important}
.synth .k{font:500 11.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.synth b{font:600 19px/1.25 var(--display)}.synth p{margin:0;color:var(--card-muted);font-size:15.5px;line-height:1.5}
.synth .go{font:600 14px var(--display);color:var(--link);margin-top:4px}
.synth.first{background:var(--accent-soft);border-color:var(--accent)}
.synth .une{justify-self:start;background:var(--accent);color:var(--accent-ink);font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:3px 9px}
@media (prefers-reduced-motion:reduce){.synth{transition:none}.synth:hover{transform:none}}
.synth-body{font-size:18px;line-height:1.6;color:var(--ink);margin:6px 0 4px}
.trends{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.trend{background:var(--trend);color:var(--trend-ink);border:1px solid var(--line);border-radius:20px;padding:18px 20px;display:grid;gap:6px;align-content:start}
.trend b{font:600 17.5px/1.2 var(--display)}
.trend p{margin:0;color:var(--trend-muted);font-size:15.5px}
.post{background:var(--card);color:var(--card-ink);border:1px solid var(--line);border-radius:22px;padding:22px 24px;display:grid;gap:10px;scroll-margin-top:96px}
.post-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.post-head .who{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;min-width:0}
.post-head .src-badge{flex:none;align-self:flex-start;margin-top:3px}
.src-logo{flex:none;display:inline-grid;place-items:center;width:20px;height:20px;margin-top:3px;color:var(--muted);opacity:.8}.src-logo svg{width:16px;height:16px;fill:currentColor}.post:hover .src-logo{opacity:1}
.plink{color:inherit;text-decoration:none;background-image:linear-gradient(currentColor,currentColor);background-size:0 1.5px;background-position:0 100%;background-repeat:no-repeat;transition:background-size .2s}.plink:hover,.plink:focus-visible{background-size:100% 1.5px}
.post-head .author{font:600 18.5px var(--display);letter-spacing:-.01em}
.post-head .role{color:var(--card-muted);font-size:14.5px}
.src-badge{align-self:center;font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;border-radius:6px;padding:3px 7px}
.s-li,.s-ss{background:var(--chip);color:var(--ink)}.s-x{background:var(--solid);color:var(--solid-ink)}
.post .idea{margin:0;font-size:17px}
.post .concret{margin:0;padding-left:18px;color:var(--concret);font-size:15.5px;display:grid;gap:3px}

.foryou{margin:0;background:var(--accent-soft);border-radius:14px;padding:10px 14px;font-size:15.5px;color:var(--accent-soft-ink)}

.meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13.5px;color:var(--card-muted)}
.meta a{color:var(--card-ink);font-weight:600;text-underline-offset:3px}
.tag{background:var(--chip);color:var(--card-muted);border-radius:8px;padding:3px 9px;font:500 13px var(--display);text-decoration:none}
.tag:hover{background:var(--pill);color:var(--pill-ink)}
.save{margin-left:auto;background:var(--solid);color:var(--solid-ink);border:0;border-radius:999px;padding:7px 14px;font:600 13.5px var(--display);cursor:pointer}
.save[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tile{background:var(--bg-2);border:1px solid var(--line);border-radius:20px;padding:18px 20px;display:grid;gap:6px;align-content:start;min-width:0}

.k-outil .kind{color:var(--t-outil-k)}.k-event .kind{color:var(--t-event-k)}

/* Share bar + side */

@media (max-width:900px){.reader-grid{grid-template-columns:minmax(0,1fr)}.side{display:none}}

   <div class="tp-fb"><div><h2>${esc(f.n)}</h2><div class="tp-meta"><span class="tp-c">${esc(cnt(f))}</span>${move(f,0)}</div></div>${f.note?`<p>${esc(f.note)}</p>`:""}</div></a>`;
  if(cur.length>1)h+=`<ol class="tp-list">${cur.slice(1).map((x,j)=>{const i=j+1;return `<li><a class="tp-row"${lnk(x)}><span class="i">${String(i+1).padStart(2,"0")}</span>
   <span class="tp-av${tl?" dk":""}${tp?" rd":""}" style="--pc-blobs:${blobOf(x.n)}" aria-hidden="true">${tl?logoImg(x):tp?photoImg(x):""}${x.tag?tagIcon(x.tag):`<span>${esc(String(x.n).trim().charAt(0).toUpperCase())}</span>`}</span>
   <span class="tp-nm"><b>${esc(x.n)}</b>${x.note||x.sub?`<small>${esc(x.sub||x.note)}</small>`:""}</span>
   <span class="tp-r"><span class="tp-rc"><span class="tp-c">${esc(cnt(x))}</span>${move(x,i)}</span></span></a></li>`}).join("")}</ol>`;
  return h+`<p class="tp-foot">${esc((hasPrev?t("topFoot"):t("topFootAll"))(pd.length,short(last)))}</p>`}

async function viewList(kind){const eds=await allEds();const q=s=>!query||JSON.stringify(s).toLowerCase().includes(query);let body="";
  if(kind==="outils"){const xs=collect(eds,"outils").filter(q).sort((a,b)=>b._dates.length-a._dates.length);body=xs.length?`<div class="tiles">${xs.map(toolHTML).join("")}</div>`:empty(t("emptyTools"));return pageHead(t("toolsA"),t("toolsB"),t("toolsP"))+body}
  if(kind==="personnes"){const xs=collect(eds,"personnes").filter(q).sort((a,b)=>b._dates.length-a._dates.length);body=xs.length?`<div class="tiles">${xs.map(personHTML).join("")}</div>`:empty(t("emptyPeople"));return pageHead(t("peopleA"),t("peopleB"),t("peopleP"))+body}
  if(kind==="evenements"){const xs=collect(eds,"evenements").filter(q);body=xs.length?`<div class="evts">${xs.map(eventHTML).join("")}</div>`:empty(t("emptyEvents"));return pageHead(t("eventsA"),t("eventsB"),t("eventsP"))+body}
  if(kind==="favoris"){const xs=postsOf(eds).filter(p=>saved.includes(p._key));body=xs.length?`<div class="narrow reader" style="padding-top:0">${xs.map(p=>postHTML(p,p._key)).join("")}</div>`:empty(t("emptySaved"));return pageHead(t("savedA"),t("savedB"),t("savedP"))+body}}

async function viewSearch(tag){const eds=await allEds();const hits=postsOf(eds).filter(p=>(!query||JSON.stringify(p).toLowerCase().includes(query))&&(!tag||arr(p.tags).includes(tag)));
  return pageHead(tag||t("searchA"),"",`${t("found")(hits.length)}${query?` « ${query} »`:""} ${t("inAll")}`).replace('<div class="hl"><span></span></div>','')+
   `<div class="more" style="margin:0 0 20px"><a class="ghost-btn" href="#" id="clearSearch">${esc(t("clear"))}</a></div>`+
   (hits.length?`<div class="narrow reader" style="padding-top:0">${hits.map(p=>`<span class="when">${esc(short(p._date))}</span>`+postHTML(p,p._key)).join("")}</div>`:empty(t("tryOther"),t("nothing")))}

/* ---------- chrome ---------- */
let query="";
function route(){const h=decodeURIComponent(location.hash.slice(1));
  const sm=h.match(/^s-(\d{4}-\d{2}-\d{2})-(.+)$/);if(sm)return{v:"synth",d:sm[1],id:sm[2]};
  if(h.startsWith("e-"))return{v:"edition",d:h.slice(2)};if(h.startsWith("tag-"))return{v:"tag",tag:h.slice(4)};
  const ap=h.match(/^archives\/(\d+)$/);if(ap)return{v:"archives",page:+ap[1]};
  if(["archives","about","outils","personnes","evenements","favoris","top"].includes(h))return{v:h};return{v:"home"}}
function renderMenu(){const r=route().v;const items=[["",t("home"),"home"],["archives",t("archives"),"archives"],["top",t("topNav"),"top"],["about",t("about"),"about"],["outils",t("tools"),"outils"],["personnes",t("people"),"personnes"],["evenements",t("events"),"evenements"],["favoris",t("saved"),"favoris"]];
  $("#menu").innerHTML=items.map(([h,l,k])=>`<a href="#${h}" ${r===k?'aria-current="page"':""}>${esc(l)}${k==="archives"?`<span class="n">${index.length}</span>`:k==="favoris"&&saved.length?`<span class="n">${saved.length}</span>`:""}</a>`).join("")+
  `<hr><div class="prefs"><div class="seg" role="group" aria-label="${esc(t("language"))}"><button data-lang="fr" aria-pressed="${lang==="fr"}">FR</button><button data-lang="en" aria-pressed="${lang==="en"}">EN</button></div>
   <div class="seg" role="group" aria-label="${esc(t("theme"))}"><button data-theme-set="light" aria-pressed="${theme==="light"}">${esc(t("light"))}</button><button data-theme-set="dark" aria-pressed="${theme==="dark"}">${esc(t("dark"))}</button><button data-theme-set="system" aria-pressed="${theme==="system"}">${esc(t("system"))}</button></div></div>`}
function renderFoot(){const now=new Date(),mins=now.getUTCHours()*60+now.getUTCMinutes();
  $("#foot").innerHTML=`<div class="foot-top"><div class="foot-brand"><a class="logo" href="#" style="justify-self:start">veille.design<i>×ia</i></a><p>${esc(t("footP"))}</p></div>
    <div class="next"><i class="dot" aria-hidden="true"></i><span><small>${esc(t("nextEd"))}</small><b>${esc((()=>{const d=now.getUTCDay(),wk=x=>x>=1&&x<=5;if(wk(d)&&mins<19*60+50)return t("tonight");let k=1;while(!wk((d+k)%7))k++;if(k===1)return t("tomorrow");const n=t("days")[(d+k)%7];return n.charAt(0).toUpperCase()+n.slice(1)+(lang==="fr"?" · 19h50":" · 7:50 pm")})())}</b></span></div></div>
    <div class="foot-cols"><div><h5>${esc(t("browse"))}</h5><ul>${[["",t("home")],["archives",t("archives")],["top",t("topNav")],["about",t("about")],["outils",t("tools")],["personnes",t("people")],["evenements",t("events")],["favoris",t("saved")]].map(([h,l])=>`<li><a href="#${h}">${esc(l)}</a></li>`).join("")}</ul></div>
    <div><h5>${esc(t("findMe"))}</h5><ul><li><a href="https://www.linkedin.com/in/isma%C3%ABl-yannick-92b9111a3/" target="_blank" rel="noopener">LinkedIn ↗</a></li>
      <li><span class="mail"><span class="addr">ismaelyannick.iy@gmail.com</span><button class="copy" id="copyMail">${esc(t("copy"))}</button></span></li>
      <li><a href="https://ismaelyannickflow.netlify.app/" target="_blank" rel="noopener">Portfolio ↗</a></li></ul></div></div>
    <div class="foot-bottom"><span>© ${now.getUTCFullYear()} Ismaël Yannick · Abidjan</span><button class="top-btn" id="toTop">${esc(t("toTop"))}</button></div>`}
/* ---------- barre de lecture ---------- */
let progOn=false;
function updProgress(){if(!progOn)return;const d=document.documentElement,max=d.scrollHeight-innerHeight;$("#progress i").style.transform=`scaleX(${max>0?Math.min(1,Math.max(0,scrollY/max)):0})`}
function setProgress(on){progOn=on;$("#progress").hidden=!on;updProgress()}
addEventListener("scroll",()=>requestAnimationFrame(updProgress),{passive:true});addEventListener("resize",updProgress);
/* ---------- statistiques (GoatCounter) : désactivé tant que GOATCOUNTER est vide ---------- */
const GOATCOUNTER=""; // ex. "nicky" pour https://nicky.goatcounter.com — à remplir après création du compte
let goatReady=false,lastTracked="";
function track(){if(!GOATCOUNTER)return;const path=location.pathname+(location.hash||"");if(path===lastTracked)return;lastTracked=path;
  if(!goatReady){goatReady=true;window.goatcounter={no_onload:true};const sc=document.createElement("script");sc.async=true;sc.src="https://gc.zgo.at/count.js";sc.dataset.goatcounter=`https://${GOATCOUNTER}.goatcounter.com/count`;sc.onload=()=>window.goatcounter.count({path});document.head.appendChild(sc);return}
  window.goatcounter&&window.goatcounter.count&&window.goatcounter.count({path})}
/* ---------- lecteur musique (MP3 hébergés sur le site, libres de droits Pixabay) ---------- */
const PLAYLIST=[
 {t:"Coverless Book",a:"AmbientAUDIOVISION",src:"assets/music/01.mp3"},
 {t:"Lofi Study",a:"FASSounds",src:"assets/music/02.mp3"},
 {t:"Lofi Coffee Shop",a:"Alex Morgan",src:"assets/music/03.mp3"},
 {t:"Good Night",a:"FASSounds",src:"assets/music/04.mp3"},
 {t:"Better Day",a:"penguinmusic",src:"assets/music/05.mp3"}];
const AUD=new Audio();AUD.preload="none";let spI=0,spSeeking=false;
function spLoad(i){spI=(i+PLAYLIST.length)%PLAYLIST.length;const tr=PLAYLIST[spI];AUD.src=tr.src;const lbl=tr.t+" · "+tr.a;$("#spMq").textContent=lbl+"\u2003\u2003\u2003"+lbl+"\u2003\u2003\u2003";$("#spMq").style.setProperty("--mq",Math.round((lbl.length+3)*7.5/24)+"s");$("#spSeek").value=0;$("#spSeek").style.setProperty("--p","0%")}
function spPlay(){AUD.play().then(()=>$("#sp").removeAttribute("data-paused")).catch(()=>{$("#sp").setAttribute("data-paused","");toast(t("spErr"))})}
function spLabels(){$("#sp").setAttribute("aria-label",t("spTitle"));$("#spPrev").setAttribute("aria-label",t("spPrev"));$("#spNext").setAttribute("aria-label",t("spNext"));$("#spSeek").setAttribute("aria-label",t("spSeekL"));
  $("#spPlay").setAttribute("aria-label",$("#sp").hasAttribute("data-paused")?t("spResume"):t("spPause"))}
spLoad(0);AUD.removeAttribute("src");AUD.load();
AUD.addEventListener("ended",()=>{spLoad(spI+1);spPlay()});
AUD.addEventListener("timeupdate",()=>{if(!spSeeking&&AUD.duration){const v=Math.round(AUD.currentTime/AUD.duration*1000);$("#spSeek").value=v;$("#spSeek").style.setProperty("--p",v/10+"%")}});
AUD.addEventListener("pause",()=>{$("#sp").setAttribute("data-paused","");spLabels()});AUD.addEventListener("play",()=>{$("#sp").removeAttribute("data-paused");spLabels()});
async function render(){
  stopStage();
  document.documentElement.lang=lang;$("#langBtn").textContent=lang==="fr"?"EN":"FR";$("#langBtn").setAttribute("aria-label",lang==="fr"?"Switch to English":"Passer en français");
  $("#q").placeholder=t("search");spLabels();$("#menuBtn").textContent=t("menu");applyTheme();renderMenu();renderFoot();
  const m=$("#main");
  if(loadErr){m.innerHTML=empty(t("retry"),t("loadErr"));return}
  if(!loaded){m.innerHTML=`<section class="hero">${hl([t("heroA")])}<div class="hl"><span>${esc(t("heroB"))}</span></div><p>${esc(t("heroP"))}</p></section>`+empty(t("loadingP"),t("loading"));return}
  const r=route();
  if(query&&r.v!=="tag")m.innerHTML=await viewSearch(null);
  else if(r.v==="edition")m.innerHTML=await viewEdition(r.d);
  else if(r.v==="synth")m.innerHTML=await viewSynth(r.d,r.id);
  else if(r.v==="tag")m.innerHTML=await viewSearch(r.tag);
  else if(r.v==="archives")m.innerHTML=await viewArchives(r.page||1);
  else if(r.v==="top")m.innerHTML=await viewTop();
  else if(r.v==="about")m.innerHTML=viewAbout();
  else if(["outils","personnes","evenements","favoris"].includes(r.v))m.innerHTML=await viewList(r.v);
  else m.innerHTML=await viewHome();
  startStage();setProgress(r.v==="edition"&&!query);track();
}
function closeMenu(){$("#menu").hidden=true;$("#menuBtn").setAttribute("aria-expanded","false")}
window.addEventListener("hashchange",()=>{query="";$("#q").value="";closeMenu();render().then(()=>window.scrollTo({top:0}))});
$("#spPlay").addEventListener("click",()=>{if(!AUD.src)spLoad(spI);AUD.paused?spPlay():AUD.pause()});
$("#spPrev").addEventListener("click",()=>{if(!AUD.src){spLoad(spI)}else if(AUD.currentTime>3){AUD.currentTime=0}else{spLoad(spI-1)}spPlay()});
$("#spNext").addEventListener("click",()=>{spLoad(spI+1);spPlay()});
$("#spSeek").addEventListener("input",e=>{spSeeking=true;if(AUD.duration)AUD.currentTime=e.target.value/1000*AUD.duration});$("#spSeek").addEventListener("change",()=>spSeeking=false);
$("#menuBtn").addEventListener("click",e=>{e.stopPropagation();const m=$("#menu");m.hidden=!m.hidden;$("#menuBtn").setAttribute("aria-expanded",String(!m.hidden))});
$("#searchBtn").addEventListener("click",()=>{const sb=$("#sb");sb.classList.toggle("open");if(sb.classList.contains("open"))$("#q").focus()});
$("#langBtn").addEventListener("click",()=>{lang=lang==="fr"?"en":"fr";store.set("vdi-lang",lang);render()});
$("#themeBtn").addEventListener("click",()=>{const dark=document.documentElement.getAttribute("data-theme")==="dark"||(theme==="system"&&matchMedia("(prefers-color-scheme: dark)").matches);theme=dark?"light":"dark";store.set("vdi-theme",theme);applyTheme();renderMenu()});
let qt;$("#q").addEventListener("input",e=>{clearTimeout(qt);qt=setTimeout(()=>{query=e.target.value.trim().toLowerCase();render()},180)});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeMenu()});
document.addEventListener("click",async e=>{
  if(!e.target.closest(".nav-inner"))closeMenu();
  const tk=e.target.closest("[data-tpk],[data-tpp]");if(tk){if(tk.dataset.tpk)topKind=tk.dataset.tpk;if(tk.dataset.tpp)topPer=tk.dataset.tpp;const y=scrollY;await render();scrollTo(0,y);return}
  const rf=e.target.closest("[data-rxf]");if(rf){const v=rf.dataset.rxf;document.querySelectorAll("[data-rxf]").forEach(b=>b.setAttribute("aria-pressed",String(b===rf)));let n=0;document.querySelectorAll("#rxGrid .rx-card").forEach(c=>{const ok=!v||c.dataset.tag===v;c.hidden=!ok||(n++>=6&&!v)});const mb=document.getElementById("rxMore");if(mb)mb.parentElement.hidden=!!v;return}
  const rm=e.target.closest("#rxMore");if(rm){const hid=[...document.querySelectorAll("#rxGrid .rx-card[hidden]")];hid.slice(0,6).forEach(x=>x.hidden=false);if(hid.length<=6)rm.parentElement.remove();return}
  const ms=e.target.closest("#moreSynth");if(ms){const hid=[...document.querySelectorAll("#synths .synth[hidden]")];hid.slice(0,2).forEach(x=>x.hidden=false);if(hid.length<=2)ms.parentElement.remove();return}
  const el=e.target.closest("[data-jump],[data-save],[data-lang],[data-theme-set],[data-copylink],#copyMail,#toTop,#clearSearch");if(!el)return;
  if(el.dataset.jump){e.preventDefault();document.getElementById(el.dataset.jump)?.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});return}
  if(el.dataset.save){const k=el.dataset.save;saved=saved.includes(k)?saved.filter(x=>x!==k):[...saved,k];store.set("vdi-saved",JSON.stringify(saved));const on=saved.includes(k);el.setAttribute("aria-pressed",String(on));el.textContent=on?t("kept"):t("keep");renderMenu();return}
  if(el.dataset.lang){lang=el.dataset.lang;store.set("vdi-lang",lang);await render();$("#menu").hidden=false;return}
  if(el.dataset.themeSet){theme=el.dataset.themeSet;store.set("vdi-theme",theme);applyTheme();renderMenu();$("#menu").hidden=false;return}
  if(el.dataset.copylink){const ok=await copyText(edUrl(el.dataset.copylink));toast(ok?t("copied"):edUrl(el.dataset.copylink));return}
  if(el.id==="copyMail"){const ok=await copyText("ismaelyannick.iy@gmail.com");if(ok){el.textContent=t("copiedMail");setTimeout(()=>el.textContent=t("copy"),1800)}else{const r=document.createRange();r.selectNodeContents(document.querySelector(".addr"));getSelection().removeAllRanges();getSelection().addRange(r)}return}
  if(el.id==="toTop"){window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});return}
  if(el.id==="clearSearch"){e.preventDefault();query="";$("#q").value="";if(location.hash)location.hash="";else render();return}
});

applyTheme();render();
(async()=>{try{await loadIndex();loaded=true}catch(_){loadErr=true}render()})();
})();
</script>
